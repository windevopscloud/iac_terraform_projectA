name: import-acm-cert

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  ENVIRONMENT: poc

jobs:
  import:
    runs-on: runner_projectA
    environment: dev
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Import certificate and publish ARN
        env:
          ACM_CERT_PEM: ${{ secrets.ACM_CERT_PEM }}
          ACM_CHAIN_PEM: ${{ secrets.ACM_CHAIN_PEM }}
          ACM_KEY_PEM: ${{ secrets.ACM_KEY_PEM }}
        run: |
          umask 077
          D=$(mktemp -d)
          trap 'rm -rf "$D"' EXIT
          printf '%s\n' "$ACM_CERT_PEM"  > "$D/cert.pem"
          printf '%s\n' "$ACM_CHAIN_PEM" > "$D/chain.pem"
          printf '%s\n' "$ACM_KEY_PEM"   > "$D/key.pem"

          PARAM="/${ENVIRONMENT}/acm/signup-cert-arn"
          EXISTING=$(aws ssm get-parameter --name "$PARAM" --query Parameter.Value --output text 2>/dev/null || true)
          EXTRA=""
          if [ -n "$EXISTING" ] && aws acm describe-certificate --certificate-arn "$EXISTING" >/dev/null 2>&1; then
            EXTRA="--certificate-arn $EXISTING"
          fi

          ARN=$(aws acm import-certificate $EXTRA \
            --certificate "fileb://$D/cert.pem" \
            --certificate-chain "fileb://$D/chain.pem" \
            --private-key "fileb://$D/key.pem" \
            --query CertificateArn --output text)

          aws ssm put-parameter --name "$PARAM" --value "$ARN" --type String --overwrite
          echo "Imported $ARN and stored it in $PARAM" >> "$GITHUB_STEP_SUMMARY"
