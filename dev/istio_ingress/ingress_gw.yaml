apiVersion: networking.istio.io/v1
kind: Gateway
metadata: { name: ext-gw, namespace: istio-ingress-ext }
spec:
  selector: { istio: ingress-ext }
  servers:
  - port: { number: 443, name: https, protocol: HTTPS }
    hosts: ["intsvc.windevopscloud.com"]
    tls: { mode: SIMPLE, credentialName: ext-tls }
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata: { name: corp-gw, namespace: istio-ingress-corp }
spec:
  selector: { istio: ingress-corp }
  servers:
  - port: { number: 443, name: https, protocol: HTTPS }
    hosts: ["corpsvc.windevopscloud.com"]
    tls: { mode: SIMPLE, credentialName: corp-tls }
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata: { name: pub-gw, namespace: istio-ingress-pub }
spec:
  selector: { istio: ingress-pub }
  servers:
  - port: { number: 443, name: https, protocol: HTTPS }
    hosts: ["extsvc.windevopscloud.com"]
    tls: { mode: SIMPLE, credentialName: pub-tls }